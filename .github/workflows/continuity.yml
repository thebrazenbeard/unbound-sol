name: continuity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Reject unsafe workspace startup paths
        run: python security/workspace_autorun_scan.py .
      - name: Test startup containment and synthetic signatures
        run: python -m unittest discover -s security -p 'test_*.py' -v
      - run: python tools/validate_public_state.py
