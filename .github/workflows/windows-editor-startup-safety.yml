name: unbound-sol Windows editor startup safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source-guard:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head or main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out source identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact source commit mismatch" }
      - name: Use pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Guard editor startup without executing workspace assets
        shell: pwsh
        run: |
          python -B security/workspace_autorun_scan.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s security -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/validate_public_state.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
