name: portfolio-currentness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "research/OWNED_PORTFOLIO_MECHANISM_CENSUS_20260923_V1.json"
      - "tools/check_public_portfolio_currentness.py"
      - ".github/workflows/portfolio-currentness.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compare bound public heads with live GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_public_portfolio_currentness.py --json
